<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Personal AI Assistant (Gemini)</title>
  <style>
    body { font-family: Inter, system-ui, Arial; background:#f5f7fb; margin:0; padding:40px; display:flex; justify-content:center; }
    .card { width:100%; max-width:720px; background:#fff; border-radius:12px; box-shadow:0 8px 30px rgba(12,20,30,0.08); padding:22px; }
    h1 { margin:0 0 14px 0; font-size:20px; display:flex; align-items:center; gap:10px; }
    textarea { width:100%; min-height:120px; padding:12px; border-radius:8px; border:1px solid #e6e9ef; font-size:15px; resize:vertical; }
    .controls { margin-top:12px; display:flex; gap:12px; align-items:center; }
    button { background:#0b84ff; color:white; border:none; padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:600; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .response { margin-top:18px; background:#f3f5ff; padding:12px; border-radius:8px; white-space:pre-wrap; min-height:70px; }
    .meta { margin-top:10px; font-size:13px; color:#666; }
    .small { font-size:13px; color:#444; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🤖 Personal AI Assistant (Gemini)</h1>

    <label class="small" for="prompt">Ask anything:</label>
    <textarea id="prompt" placeholder="Type a question, e.g. What is AI?"></textarea>

    <div class="controls">
      <button id="askBtn" onclick="askAI()">Ask</button>
      <div class="meta">Tip: open browser Console (F12) to see the raw API response.</div>
    </div>

    <div id="response" class="response">No reply yet.</div>
    <div class="meta">Status: <span id="status">idle</span></div>
  </div>

<script>
/*
  Single-file client to call Google AI Studio (Gemini) generateContent.
  IMPORTANT: This stores the API key in the page (visible). For quick testing ONLY.
  For production hide the key behind a server/proxy.
*/

const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent";
const API_KEY = "AIzaSyBK_SXYW-3pjEcBFqMj2GBUn0kuPMcydJk"; // <-- REPLACE with your Google AI Studio API key

async function askAI() {
  const promptEl = document.getElementById('prompt');
  const responseEl = document.getElementById('response');
  const statusEl = document.getElementById('status');
  const askBtn = document.getElementById('askBtn');

  const text = promptEl.value.trim();
  if (!text) {
    responseEl.textContent = 'Please type a question.';
    return;
  }

  responseEl.textContent = 'Thinking...';
  statusEl.textContent = 'calling API';
  askBtn.disabled = true;

  try {
    const body = {
      // The `contents` array is the minimal required field for generateContent
      contents: [{ parts: [{ text }] }],
      // You can add other options like safetySettings, temperature, maxOutputTokens if desired
      // temperature: 0.2,
      // maxOutputTokens: 512
    };

    const res = await fetch(`${API_URL}?key=${API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await res.json();
    console.log("Full Gemini API response:", data); // CHECK THIS in browser console

    // Robust extraction: try a few possible shapes the API might return
    let reply = null;

    // Common older shape used in examples:
    if (data?.candidates?.length) {
      try {
        reply = data.candidates[0].content?.parts?.[0]?.text ?? data.candidates[0].output ?? JSON.stringify(data.candidates[0]);
      } catch(e) { /* ignore */ }
    }

    // Another possible shape:
    if (!reply && data?.output?.[0]?.content?.[0]?.text) {
      reply = data.output[0].content[0].text;
    }

    // Another fallback: top-level `response` or `generatedText`
    if (!reply && data?.response) reply = data.response;
    if (!reply && data?.generatedText) reply = data.generatedText;

    // If still missing, show a helpful diagnostic
    if (!reply) {
      if (data?.error) {
        reply = "API returned error: " + (data.error.message || JSON.stringify(data.error));
      } else {
        reply = "No reply found in API response. See console log for raw response.";
      }
    }

    responseEl.textContent = reply;
    statusEl.textContent = res.ok ? 'ok' : `api error (${res.status})`;
  } catch (err) {
    console.error("Request failed:", err);
    responseEl.textContent = 'Network or CORS error: ' + err.message;
    statusEl.textContent = 'network error';
  } finally {
    askBtn.disabled = false;
  }
}
</script>
</body>
</html>
