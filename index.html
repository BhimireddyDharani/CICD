<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal AI Assistant</title>
<style>
body { font-family: Arial, sans-serif; background:#f5f5f5; display:flex; flex-direction:column; align-items:center; margin:0; padding:20px; }
.container { background:#fff; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); width:100%; max-width:500px; }
textarea { width:100%; height:80px; border-radius:6px; border:1px solid #ccc; padding:10px; }
button { background:#007bff; color:#fff; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; margin-top:10px; }
button:hover { background:#0056b3; }
.response { background:#eef; padding:10px; border-radius:6px; margin-top:15px; white-space:pre-wrap; }
</style>
</head>
<body>
  <div class="container">
    <h2>🤖 Personal AI Assistant</h2>
    <textarea id="question" placeholder="Ask me anything..."></textarea>
    <button onclick="askAI()">Ask</button>
    <div id="response" class="response"></div>
  </div>

<script>
async function askAI() {
  const question = document.getElementById('question').value.trim();
  const responseDiv = document.getElementById('response');
  if (!question) { responseDiv.textContent = 'Please enter a question.'; return; }
  responseDiv.textContent = 'Thinking...';

  // Replace with your own API endpoint or public proxy
  const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent"; // example public endpoint
  const API_KEY = "AIzaSyDD4SzjKpan7aLAgLRC9iHCircVJeuplHI"; // ⚠️ never share real key publicly

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: "mistral-tiny",
        messages: [{ role: "user", content: question }]
      })
    });

    const data = await res.json();
    responseDiv.textContent = data.choices?.[0]?.message?.content || "No reply.";
  } catch (err) {
    responseDiv.textContent = "Error: " + err.message;
  }
}
</script>
</body>
</html>
